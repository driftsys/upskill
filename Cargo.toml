[package]
name = "upskill"
version = "0.8.1"
edition = "2024"
description = "Author and distribute AI-assistance content across coding agents"
license = "MIT"
repository = "https://github.com/driftsys/upskill"
homepage = "https://driftsys.github.io/upskill/"
readme = "README.md"
keywords = ["agent", "skills", "cli", "ai", "package-manager"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
colored = "3"
ctrlc = "3.4"
dprint-plugin-markdown = "=0.21.1"
pulldown-cmark = "0.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10"
sha2 = "0.11.0"
tempfile = "3.14"
thiserror = "2.0"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
assert_cmd = "2.0"
clap_mangen = "0.2"
predicates = "3.1.4"
serde_json = "1.0.149"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"
panic = "abort"

# dprint-plugin-markdown 0.21.1 emits a multi-line inline code span (valid
# CommonMark — `code` wrapping across a source line break) as a single
# dprint-core IR string that still contains the newline. That trips a
# dprint-core debug_assert ("Found a newline in the string") and panics
# `upskill add` in debug/test builds. The rendered output is correct — the
# assertion is compiled out in release, where dprint-core runs with
# debug-assertions off. upskill never authors dprint IR itself (it only
# calls dprint-plugin-markdown), so this third-party self-check polices
# nothing in our code. Disable it for the dprint-core package only, so dev
# and test builds match release behaviour on valid input.
[profile.dev.package.dprint-core]
debug-assertions = false
