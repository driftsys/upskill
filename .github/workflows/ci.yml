name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  msrv:
    name: MSRV (Rust 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - name: Validate Linux destination omission controls (temporary)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import signal
          import subprocess
          import tempfile

          source = Path("src/filesystem/destinations/qualification.rs")
          original = source.read_bytes()
          expected_hash = hashlib.sha256(original).hexdigest()
          cases = [
              ("linux-profile-check", "if magic != 0xef53 && magic != 0x01021994 {", "if false {", "production_entry_rejects_unknown_native_profile", "production qualification accepted unknown native profile"),
              ("linux-profile-wiring", "linux_profile(metadata.f_type as u64)?;", "let _ = metadata.f_type;", "production_entry_rejects_unknown_native_profile", "production qualification accepted unknown native profile"),
              ("linux-mask-check", "if mask & MOUNT_ID_MASK == 0 {", "if false && mask & MOUNT_ID_MASK == 0 {", "production_entry_rejects_missing_returned_mount_id_mask", "production qualification accepted missing returned mount-ID mask"),
              ("linux-mask-wiring", "id: linux_mount_id(stat.stx_mask, stat.stx_mnt_id)?,", "id: stat.stx_mnt_id,", "production_entry_rejects_missing_returned_mount_id_mask", "production qualification accepted missing returned mount-ID mask"),
          ]

          def run(command, environment):
              child = subprocess.Popen(command, env=environment, stdout=subprocess.PIPE,
                                       stderr=subprocess.STDOUT, start_new_session=True)
              try:
                  output = child.communicate(timeout=180)[0].decode(errors="replace")
              except subprocess.TimeoutExpired:
                  os.killpg(child.pid, signal.SIGKILL)
                  output = child.communicate()[0].decode(errors="replace")
                  print(output, flush=True)
                  raise
              print(output, flush=True)
              return child.returncode, output

          with tempfile.TemporaryDirectory(prefix="upskill-linux-control-home-") as home:
              environment = os.environ.copy()
              environment.setdefault("CARGO_HOME", str(Path.home() / ".cargo"))
              environment.setdefault("RUSTUP_HOME", str(Path.home() / ".rustup"))
              environment.update(HOME=home, USERPROFILE=home, RUSTC_WRAPPER="")
              for name, old, new, test, assertion in cases:
                  text = original.decode()
                  assert text.count(old) == 1, (name, "mutation target count")
                  try:
                      source.write_text(text.replace(old, new, 1))
                      status, output = run(["cargo", "test", "--locked", "--lib", test], environment)
                      assert status == 101, (name, status)
                      assert "panicked at" in output and assertion in output, name
                      assert "error[E" not in output and "warning:" not in output, name
                      print("CONTROL " + name + ": intended assertion RED", flush=True)
                  finally:
                      source.write_bytes(original)
                      assert hashlib.sha256(source.read_bytes()).hexdigest() == expected_hash
                      print("RESTORED " + name + ": " + expected_hash, flush=True)
              status, _ = run(["cargo", "test", "--locked", "--lib", "filesystem::destinations::"], environment)
              assert status == 0, "restored destination GREEN"
              print("RESTORED GREEN qualification SHA256 " + expected_hash, flush=True)
          PY

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - run: shellcheck install.sh bootstrap

  repository-tools:
    name: Repository tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Install latest git-std and prim
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          ./bootstrap
      - name: Check repository hygiene
        run: prim lint .
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: git std lint --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install mdBook
        run: |
          mkdir mdbook
          curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --directory=mdbook
          echo "$PWD/mdbook" >> "$GITHUB_PATH"
      - run: python3 scripts/test-check-docs.py
      - run: python3 scripts/check-docs.py

  ci:
    name: CI
    if: always()
    needs: [fmt, clippy, msrv, test, shellcheck, repository-tools, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              exit 1
            fi
          done
